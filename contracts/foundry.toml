[profile.default]
src = "src"
out = "out"
libs = ["lib"]
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[rpc_endpoints]
hsk_testnet = "https://testnet.hsk.xyz"

# HSK Chain testnet explorer (testnet-explorer.hsk.xyz) is Blockscout-based, so
# verification doesn't need an API key. Deploy + verify with:
#   forge script script/Deploy.s.sol --rpc-url hsk_testnet --broadcast \
#     --verify --verifier blockscout --verifier-url https://testnet-explorer.hsk.xyz/api

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
